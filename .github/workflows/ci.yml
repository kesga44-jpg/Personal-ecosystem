name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Blokkerend: alles wat in de gebouwde apps terechtkomt.
      - name: Audit runtime-afhankelijkheden (blokkerend)
        run: npm audit --omit=dev --audit-level=high
      # Niet blokkerend: dev-tooling (build, test, lint). Bevindingen blijven
      # zichtbaar in de log en worden handmatig beoordeeld.
      - name: Audit alle afhankelijkheden (waarschuwing)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:auth
      - run: npm run build:all
      - run: npm run check:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
